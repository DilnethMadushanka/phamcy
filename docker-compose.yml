version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pharmacy_db
    environment:
      POSTGRES_DB: pharmacy_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./server
    container_name: pharmacy_api
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      JWT_SECRET: pharmacy_super_secret_jwt_key_2026
      DB_DIALECT: postgres
      DB_NAME: pharmacy_db
      DB_USER: postgres
      DB_PASS: postgrespassword
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      - postgres

  client:
    build: ./client
    container_name: pharmacy_ui
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
